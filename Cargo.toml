[package]
name = "bli"
version = "0.1.0"
edition = "2021"
description = "Run a ticket-to-merged-code development workflow across lane hosts and issue trackers"

[dependencies]
clap = { version = "4", features = ["derive"] }
cliclack = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
ureq = "3"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
tiny_http = "0.12"
